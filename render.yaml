services:
  - type: web
    name: khienthiviet
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEV_ADMIN_PIN
        sync: false
      - key: CUSTOM_DOMAIN
        value: hoangdev08.id.vn
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_DATABASE_ID
        value: "(default)"
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_DATA_BRANCH
        value: render-data
